version: '3.8'

services:
  plone:
    build: .
    ports:
      - "8070:8070"
    volumes:
      - ./var/filestorage:/plone/instance/var/filestorage
      - ./var/blobstorage:/plone/instance/var/blobstorage
      - ./migration-data:/migration-data
      # Bind only the importable package tree, not the whole develop checkout.
      # Mounting ./src/imi.migration over the develop checkout hides the
      # imi.migration.egg-info generated by buildout, so z3c.autoinclude can no
      # longer resolve the imi.migration distribution at Zope startup.
      # Python/ZCML/templates/CSS/JS changes still appear directly and normally
      # need only a container restart.
      - ./src/imi.migration/src/imi/migration:/plone/instance/src/imi.migration/src/imi/migration
      - ./tools:/plone/instance/tools
      # Full 4.3 export stays outside Git. Override PLONE43_EXPORT_DIR when
      # the old checkout is not ../previous_plone/src/export.
      - ${PLONE43_EXPORT_DIR:-../previous_plone/src/export}:/migration-data/export
    environment:
      TZ: Europe/Ljubljana
    restart: unless-stopped
