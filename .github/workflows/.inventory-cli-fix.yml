name: one-shot inventory CLI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Plone 4.3 inventory argv parsing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/plone43_inventory.py')
          s = p.read_text()
          start = s.index('def parse_inventory_args(argv, script_name):')
          end = s.index('\n\ndef parse_output_dir(args):', start)
          new = '''def parse_inventory_args(argv, script_name):
    """Parse arguments passed by Zope 2.13's ``instance run`` command.

    In the Plone 4.3 runner the executed script sees the Python interpreter
    as argv[0], ``-c`` as argv[1], the script filename as argv[2], and the
    script's own arguments from argv[3:].  This is also the shape documented
    by existing Plone 4.3-era scripts.  A direct script-like shape is accepted
    for tests and alternate wrappers, but launcher bookkeeping is removed only
    in these known positions.
    """
    argv = list(argv)
    expected = _script_basename(script_name)
    if len(argv) >= 3 and argv[1] == '-c' and _script_basename(argv[2]) == expected:
        return parse_output_dir(argv[3:])
    if len(argv) >= 4 and argv[0] == expected and argv[1] == '-c' and _script_basename(argv[2]) == expected:
        return parse_output_dir(argv[3:])
    if argv and _script_basename(argv[0]) == expected:
        args = argv[1:]
        if args and _script_basename(args[0]) == expected:
            args = args[1:]
        if args and args[0] == '-c':
            args = args[1:]
            if args and _script_basename(args[0]) == expected:
                args = args[1:]
        return parse_output_dir(args)
    if len(argv) >= 2 and argv[0] == '-c' and _script_basename(argv[1]) == expected:
        return parse_output_dir(argv[2:])
    raise SystemExit('Unexpected Plone/Zope run argv shape: %r' % argv)
'''
          p.write_text(s[:start] + new + s[end:])
          PY
          python3 -m py_compile tools/plone43_inventory.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/.inventory-cli-fix.yml')
          p.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/plone43_inventory.py .github/workflows/.inventory-cli-fix.yml
          git commit -m 'Fix Plone 4.3 inventory argv parsing'
          git push
