name: Fix inventory argv parser
on:
  push:
    paths:
      - .github/workflows/fix-inventory-argv.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/plone43_inventory.py')
          s = p.read_text()
          start = s.index('def parse_inventory_args(argv, script_name):')
          end = s.index('\ndef parse_output_dir(args):', start)
          replacement = '''def parse_inventory_args(argv, script_name):
    """Parse the arguments exposed by Plone 4.3/Zope 2.13 ``instance run``.

    The supported/documented script view is ``[script, args...]``.  Some
    generated Plone 4.3 launchers expose their Python ``-c`` bookkeeping and
    a duplicate script name as well.  We normalize only those exact forms;
    genuine inventory arguments are still validated by parse_output_dir().
    """
    argv = list(argv)
    if not argv:
        raise SystemExit('Unable to determine inventory script arguments.')

    expected = _script_basename(script_name)
    tokens = list(argv)

    # In the actual plone.recipe.zope2instance/Zope 2.13 launcher, sys.argv
    # may be: [interpreter-or-script, '-c', script, script_args...].
    if len(tokens) >= 3 and tokens[1] == '-c' and _script_basename(tokens[2]) == expected:
        return parse_output_dir(tokens[3:])

    # Some wrappers make the inventory script argv[0], while retaining the
    # script and/or '-c' in the remaining arguments.  Accept only the exact
    # bookkeeping forms, never arbitrary unknown options.
    if _script_basename(tokens[0]) == expected:
        args = tokens[1:]
        if args and _script_basename(args[0]) == expected:
            args = args[1:]
            if args and args[0] == '-c':
                args = args[1:]
        elif args and args[0] == '-c':
            args = args[1:]
        return parse_output_dir(args)

    # Direct wrapper form where Python's -c marker precedes the script.
    if tokens[0] == '-c' and len(tokens) >= 2 and _script_basename(tokens[1]) == expected:
        return parse_output_dir(tokens[2:])

    raise SystemExit('Unexpected Plone/Zope run argv shape: %r' % argv)
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          python3 -m py_compile tools/plone43_inventory.py
          python3 - <<'PY'
          import ast
          p = 'tools/plone43_inventory.py'
          ast.parse(open(p, 'rb').read().decode('utf-8'), p)
          print('inventory parser syntax check passed')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/plone43_inventory.py
          git rm .github/workflows/fix-inventory-argv.yml
          git commit -m 'Fix Plone 4.3 instance run argv parsing'
          git push
