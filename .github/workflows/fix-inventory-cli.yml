name: Fix Plone 4.3 inventory CLI

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix Plone 4.3 inventory CLI [bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix script and regression test
        run: |
          python3 <<'PY'
          from pathlib import Path
          import ast

          p = Path('tools/plone43_inventory.py')
          s = p.read_text(encoding='utf-8')
          old = "run(app, parse_inventory_args(sys.argv, globals().get('__file__', 'plone43_inventory.py')))"
          new = "run(app, parse_inventory_args(sys.argv, 'plone43_inventory.py'))"
          if old not in s:
              raise SystemExit('expected inventory entry point not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          ast.parse(p.read_text(encoding='utf-8'), str(p))

          test = '''#!/usr/bin/env python
# -*- coding: utf-8 -*-
"""Dependency-free Plone 4.3 inventory argv regression test."""
from __future__ import print_function

import ast
import os

HERE = os.path.dirname(os.path.abspath(__file__))
SOURCE = os.path.join(HERE, 'plone43_inventory.py')


def main():
    with open(SOURCE, 'rb') as handle:
        tree = ast.parse(handle.read().decode('utf-8'), SOURCE)
    wanted = set(('parse_output_dir', 'parse_inventory_args'))
    nodes = [n for n in tree.body
             if isinstance(n, ast.FunctionDef) and n.name in wanted]
    assert len(nodes) == 2
    module = ast.Module(body=nodes)
    ast.fix_missing_locations(module)
    ns = {'os': os}
    exec(compile(module, SOURCE, 'exec'), ns)
    parse = ns['parse_inventory_args']
    script = 'src/plone43_inventory.py'
    output = '--output-dir=/plone/instance/src'
    cases = [
        [script, output],
        [script, script, output],
        [script, '-c', script, output],
        ['/plone/instance/parts/instance/bin/interpreter', '-c', script, output],
        ['-c', script, output],
    ]
    for argv in cases:
        assert parse(argv, script) == '/plone/instance/src', argv
    for argv in ([script, '--bogus'], [script, 'other.py']):
        try:
            parse(argv, script)
        except SystemExit:
            pass
        else:
            raise AssertionError('unexpected argument accepted: %r' % (argv,))
    print('plone43_inventory argv compatibility checks: OK')


if __name__ == '__main__':
    main()
'''
          Path('tools/test_plone43_inventory_static.py').write_text(test, encoding='utf-8')
          PY
          python3 -m py_compile tools/plone43_inventory.py
          python3 tools/test_plone43_inventory_static.py
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-inventory-cli.yml
          git add tools/plone43_inventory.py tools/test_plone43_inventory_static.py
          git commit -m 'Fix Plone 4.3 inventory CLI [bot]'
          git push
