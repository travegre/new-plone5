[theme]
title = IMI hostname admin theme
description = Apply Barceloneta only on 127.0.0.1 and admin.* hosts; leave public hosts unthemed.
rules = /++theme++imi-admin/rules.xml
prefix = /++theme++barceloneta
doctype = <!DOCTYPE html>

# Reuse Barceloneta's compiled resources when the Diazo theme is active.
development-css = /++theme++barceloneta/less/barceloneta.plone.less
production-css = /++theme++barceloneta/less/barceloneta-compiled.css
