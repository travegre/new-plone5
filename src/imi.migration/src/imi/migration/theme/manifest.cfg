[theme]
title = IMI hostname admin theme
description = Apply Barceloneta only on 127.0.0.1 and admin.* hosts; leave public hosts unthemed.
rules = /++theme++imi-admin/rules.xml
prefix = /++theme++barceloneta
doctype = <!DOCTYPE html>

# Barceloneta CSS is injected explicitly by rules.xml.  Keeping it here makes
# plone.app.theming generate a site-relative /<site>//++theme++barceloneta URL
# for this inherited theme, which is wrong for the global theme resource.
