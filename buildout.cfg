[buildout]
extends = https://dist.plone.org/release/5.2.15/versions.cfg
parts = instance
develop = src/imi.migration
eggs =
    Plone
    imi.migration
    collective.easyform==3.2.1

[instance]
recipe = plone.recipe.zope2instance
user = admin:admin
http-address = 8080
egss = ${buildout:eggs}
eggs = ${buildout:eggs}
zcml =
    imi.migration

# Migration work may include larger files than Zope's newer conservative
# defaults. Keep this explicit and review before production cut-over.
zope-conf-additional =
    <dos_protection>
      form-memory-limit 64MB
    </dos_protection>
